name: Scrape Motohouse inventory

# Runs daily at 6:00 AM America/Chicago (Picayune, MS), which matches
# the dealer site's own overnight inventory refresh.
#
# This runs on a self-hosted runner (your own PC) instead of GitHub's
# cloud servers, because motohousems.com's firewall blocks requests
# coming from cloud/datacenter IP ranges (which is what GitHub-hosted
# runners use) but not normal home internet connections. See the
# README for how to install the self-hosted runner.
#
# GitHub's cron scheduler only understands UTC and has no concept of
# Daylight Saving Time, so a single "6am Central" cron would drift an
# hour for half the year. Instead we trigger at BOTH UTC times that
# 6am Central can fall on (11:00 UTC during CDT, 12:00 UTC during CST)
# and use a guard step that checks the real Chicago clock and skips
# the run if it isn't actually ~6am there. Net effect: exactly one
# real scrape per day, always at 6am local time (as long as your PC
# is on and connected then -- if it's off, that day's update is just
# skipped and the app keeps showing the last data it had).
#
# Steps use PowerShell (built into every Windows PC) rather than bash,
# since a fresh Windows self-hosted runner doesn't have bash on PATH.
#
# Python is invoked by its full install path below (rather than just
# "python"/"pip") because the self-hosted runner service starts before
# PATH changes take effect (Windows services cache their environment
# at boot), so relying on PATH alone is unreliable without a reboot.
on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 AM CDT (Mar-Nov)
    - cron: "0 12 * * *"   # 6:00 AM CST (Nov-Mar)
  workflow_dispatch: {}     # lets you trigger a manual re-scrape any time
                            # from the Actions tab in GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: self-hosted
    steps:
      - name: Check it's ~6am America/Chicago (or a manual run)
        id: guard
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $chicago = [System.TimeZoneInfo]::FindSystemTimeZoneById("Central Standard Time")
          $hour = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $chicago).Hour
          Write-Host "Local Chicago hour: $hour"
          if ($hour -eq 6) {
            "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        shell: powershell
        run: C:\Users\chasb\AppData\Local\Python\bin\python.exe -m pip install -r scraper/requirements.txt
      - name: Run scraper
        if: steps.guard.outputs.run == 'true'
        working-directory: scraper
        shell: powershell
        run: C:\Users\chasb\AppData\Local\Python\bin\python.exe scrape.py --out ../docs/data/inventory.json
      - name: Commit updated inventory
        if: steps.guard.outputs.run == 'true'
        shell: powershell
        run: |
          git config user.name "motohouse-inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/inventory.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No inventory changes."
          } else {
            $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
            git commit -m "Update inventory ($stamp UTC)"
            git push
          }
